<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ekonomi Sepeti</title>
<meta name="description" content="İzmir Ekonomi Üniversitesi çevresindeki esnafların menüleri">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --surface:#ffffff; --surface-2:#f0ede6; --ink:#16181d; --muted:#6b6f78; --line:#e4e0d6;
  --brand:#1b2a6b; --brand-ink:#ffffff; --accent:#ff6a3d; --accent-soft:#ffe6dc;
  --ok:#12a150; --ok-soft:#dcf5e6; --no:#c2410c; --no-soft:#fde8dc;
  --radius:20px; --shadow:0 1px 2px rgb(0 0 0/.04),0 8px 24px -12px rgb(20 20 40/.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1015; --surface:#171a21; --surface-2:#1f232c; --ink:#f1f2f4; --muted:#9aa0ab; --line:#2a2f3a;
  --brand:#8ea2ff; --brand-ink:#0e1015; --accent:#ff8a63; --accent-soft:#3a2219;
  --ok:#4ade80; --ok-soft:#15301f; --no:#fb923c; --no-soft:#35200f;
  --shadow:0 1px 2px rgb(0 0 0/.3),0 12px 32px -16px rgb(0 0 0/.6);
}}
:root[data-theme="dark"]{
  --bg:#0e1015; --surface:#171a21; --surface-2:#1f232c; --ink:#f1f2f4; --muted:#9aa0ab; --line:#2a2f3a;
  --brand:#8ea2ff; --brand-ink:#0e1015; --accent:#ff8a63; --accent-soft:#3a2219;
  --ok:#4ade80; --ok-soft:#15301f; --no:#fb923c; --no-soft:#35200f;
  --shadow:0 1px 2px rgb(0 0 0/.3),0 12px 32px -16px rgb(0 0 0/.6);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3,.display{font-family:"Bricolage Grotesque",Inter,sans-serif;letter-spacing:-.02em;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

/* header */
header{position:sticky;top:0;z-index:20;backdrop-filter:saturate(1.4) blur(14px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.logo i{width:34px;height:34px;border-radius:11px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-style:normal;font-size:15px;transform:rotate(-6deg)}
.logo b{color:var(--accent)}
.clock{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:12px;display:grid;place-items:center}

/* hero */
.hero{padding:40px 0 24px;position:relative}
.hero h1{font-size:clamp(34px,7vw,64px);line-height:.98;font-weight:800;max-width:14ch}
.hero h1 em{font-style:normal;background:linear-gradient(100deg,var(--accent),#ffb03d);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);margin:14px 0 22px;max-width:52ch}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 16px;height:54px;box-shadow:var(--shadow);max-width:560px}
.search input{flex:1;border:0;background:transparent;outline:0;font:inherit;font-size:16px;color:var(--ink);min-width:0}
.search:focus-within{border-color:var(--brand)}
.blob{position:absolute;right:-60px;top:-40px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--accent-soft),transparent 65%);z-index:-1;filter:blur(8px)}

/* section */
section{margin:28px 0 48px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sec-head h2{font-size:28px;font-weight:700}
.sec-head small{color:var(--muted)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-bottom:16px}
.chips button{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;font-weight:500;white-space:nowrap;transition:.15s}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* places */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:0;overflow:hidden;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s;animation:rise .35s ease both}
.card:hover{transform:translateY(-3px);box-shadow:0 18px 40px -18px rgb(20 20 40/.35)}
.card:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.cover{height:110px;background:var(--c,var(--surface-2))}
/* dark theme: same hue, vivid mid-tone (browsers without relative colors keep the pastel) */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cover{background:oklch(from var(--c) .64 .16 h)}}
:root[data-theme="dark"] .cover{background:oklch(from var(--c) .64 .16 h)}
.thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;vertical-align:middle;margin-right:10px;cursor:zoom-in;background:var(--surface-2)}
.zoom{width:100%;border-radius:16px;margin:0 0 12px;display:block}
.card .body{padding:14px 16px 16px}
.card h3{font-size:18px;margin-bottom:4px}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px;padding:3px 9px;border-radius:999px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.status.open{background:var(--ok-soft);color:var(--ok)}
.status.open::before{animation:pulse 1.6s infinite}
.status.closed{background:var(--no-soft);color:var(--no)}
.card .hit{margin-top:10px;font-size:13px;color:var(--accent);font-weight:600}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius)}

/* dialog */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(680px,100%);max-height:88vh;border-radius:24px;box-shadow:0 40px 80px -20px rgb(0 0 0/.5)}
dialog::backdrop{background:rgb(10 12 20/.55);backdrop-filter:blur(4px)}
dialog[open]{animation:pop .25s ease}
.dhead{position:sticky;top:0;background:var(--surface);padding:20px 20px 14px;border-bottom:1px solid var(--line);z-index:1}
.dhead h2{font-size:26px;padding-right:44px}
.dhead .close{position:absolute;right:16px;top:16px}
.dhead .note{margin:10px 0 0;font-size:13px;background:var(--accent-soft);color:var(--ink);padding:8px 12px;border-radius:12px}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.actions a{text-decoration:none;color:var(--ink);border:1px solid var(--line);padding:7px 12px;border-radius:12px;font-weight:500;font-size:14px}
.dbody{padding:8px 20px 24px}
.actions a.call{background:var(--ok);color:#fff;border-color:transparent;font-weight:600}
.star{color:#f5a524;font-weight:600}
.reviews{display:grid;gap:10px;padding-bottom:14px}
.review{background:var(--surface-2);border-radius:14px;padding:10px 12px;font-size:14px}
.review small{display:block;color:var(--muted);margin-bottom:4px}
.gsrc{font-size:13px;color:var(--muted)}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:14px 2px;font-weight:600;font-family:"Bricolage Grotesque",Inter,sans-serif;font-size:17px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:22px;color:var(--muted);transition:transform .2s}
details[open] summary::after{transform:rotate(45deg)}
table{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:14px}
th{text-align:right;color:var(--muted);font-weight:500;font-size:12px;padding:4px 6px;text-transform:uppercase;letter-spacing:.04em}
th:first-child{text-align:left}
td{padding:9px 6px;border-top:1px dashed var(--line);text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
td:first-child{text-align:left;font-weight:400;white-space:normal}
tr.match td{background:var(--accent-soft)}


@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(10px)}}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:600px){
  dialog{margin:auto 0 0;max-height:92vh;border-radius:24px 24px 0 0}
  .clock{display:none}
}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <div class="logo"><i>iEÜ</i><span>ekonomi<b>sepeti</b></span></div>
    <span class="clock" id="clock"></span>
    <button class="icon-btn" id="theme" aria-label="Tema değiştir">◐</button>
  </div>
</header>

<main class="wrap">
  <div class="hero">
    <div class="blob"></div>
    <h1>Bugün kampüste <em>ne yesek?</em></h1>
    <p>İzmir Ekonomi Üniversitesi çevresindeki esnafların menüleri, fiyatları ve çalışma saatleri tek yerde. Siparişini doğrudan esnafı arayarak ver, komisyon da sana indirim olsun.</p>
    <label class="search">
      <span aria-hidden="true">⌕</span>
      <input id="q" type="search" placeholder="Ürün veya esnaf ara… (ör. tost, latte)" autocomplete="off">
    </label>
  </div>

  <section id="mekanlar">
    <div class="sec-head"><div><h2>Esnaflar</h2><small id="pl-sub"></small></div></div>
    <div class="chips" id="chips" role="group" aria-label="Filtre"></div>
    <div class="grid" id="grid"></div>
  </section>
</main>


<dialog id="dlg" aria-labelledby="dlg-title"></dialog>

<script>
// Esnaflar /api/esnaflar'dan gelir (esnaflar.json + admin panelinden eklenenler).
const DATA = {mekanlar: []};

const $ = s => document.querySelector(s);
const tl = n => n < 0 ? "—" : n + "₺";
const norm = s => s.toLocaleLowerCase("tr-TR");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// "HH:MM-HH:MM"; close <= open means it runs past midnight
function isOpen(hours, now = new Date()) {
  if (!hours) return false;
  const [o, c] = hours.split("-").map(t => { const [h, m] = t.split(":"); return h * 60 + +m; });
  const n = now.getHours() * 60 + now.getMinutes();
  return c > o ? n >= o && n < c : n >= o || n < c;
}

/* ---------- mekanlar ---------- */
let filter = "Tümü";
function renderChips() {
  const FILTERS = ["Tümü", "Şu an açık", ...new Set(DATA.mekanlar.map(m => m.type))];
  $("#chips").innerHTML = FILTERS.map(f => `<button aria-pressed="${f === filter}">${esc(f)}</button>`).join("");
}
$("#chips").onclick = e => {
  if (e.target.tagName !== "BUTTON") return;
  filter = e.target.textContent;
  [...$("#chips").children].forEach(b => b.setAttribute("aria-pressed", b === e.target));
  renderPlaces();
};

// item = [name, ...prices, imageUrl?]
const splitItem = ([n, ...rest]) => typeof rest.at(-1) === "string" ? {n, p: rest.slice(0, -1), img: rest.at(-1)} : {n, p: rest, img: null};

const itemHits = (m, q) => q ? m.cats.flatMap(c => c.items.filter(i => norm(i[0]).includes(q))) : [];

function renderPlaces() {
  const q = norm($("#q").value.trim());
  const list = DATA.mekanlar
    .filter(m => filter === "Tümü" || (filter === "Şu an açık" ? isOpen(m.hours) : m.type === filter))
    .map(m => ({m, hits: itemHits(m, q), nameHit: !q || norm(m.name).includes(q)}))
    .filter(x => x.nameHit || x.hits.length)
    .sort((a, b) => !!b.m.featured - !!a.m.featured || isOpen(b.m.hours) - isOpen(a.m.hours));
  const openCount = DATA.mekanlar.filter(m => isOpen(m.hours)).length;
  $("#pl-sub").textContent = `${openCount} / ${DATA.mekanlar.length} esnaf şu an açık`;
  $("#grid").innerHTML = list.length ? list.map(({m, hits}, i) => {
    const open = isOpen(m.hours);
    return `<button class="card" data-id="${esc(m.id)}" style="--c:${esc(m.color)};animation-delay:${i * 40}ms">
      <div class="cover" aria-hidden="true"></div>
      <div class="body">
        <h3>${esc(m.name)}</h3>
        <div class="meta">${m.hours ? `<span class="status ${open ? "open" : "closed"}">${open ? "Açık" : "Kapalı"}</span>` : ""}<span>${esc(m.hours || "Saat bilinmiyor")}</span><span>· ${esc(m.type)}</span>${m.google?.rating ? `<span class="star">★ ${m.google.rating.toFixed(1)}</span>` : ""}</div>
        ${hits.length ? `<div class="hit">${hits.length} ürün eşleşti: ${esc(hits.slice(0, 2).map(h => h[0]).join(", "))}</div>` : ""}
      </div></button>`;
  }).join("") : `<div class="empty">“${esc($("#q").value)}” için sonuç yok.</div>`;
}
$("#grid").onclick = e => { const c = e.target.closest(".card"); if (c) openPlace(c.dataset.id); };
$("#q").oninput = renderPlaces;

// "3 hafta önce" → approx. days, so reviews can be sorted newest-first
const UNIT = {dakika: 0, saat: 0, gün: 1, hafta: 7, ay: 30, yıl: 365};
const ageDays = when => { const [, n, u] = /(\d+|bir)\s*(dakika|saat|gün|hafta|ay|yıl)/.exec(when) || []; return u ? (n === "bir" ? 1 : +n) * UNIT[u] : Infinity; };
// "maps/place/?q=place_id:X" isn't a documented Maps URL and often opens the wrong spot; use the official search form
const mapsUrl = (url, name) => { const id = url.match(/place_id:([\w-]+)/)?.[1]; return id ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name)}&query_place_id=${id}` : url; };
const googleHtml = (g, name) => `<summary>Google yorumları <span class="star">${g.rating ? `★ ${g.rating.toFixed(1)}` : ""}${g.count ? ` (${g.count})` : ""}</span></summary>
      <div class="reviews">${[...g.reviews].sort((a, b) => ageDays(a[2]) - ageDays(b[2])).map(([s, txt, when, who]) => `<div class="review"><small><span class="star">${"★".repeat(s)}</span>${"☆".repeat(5 - s)} · ${esc(when)}${who ? ` · ${esc(who)}` : ""}</small>${esc(txt)}</div>`).join("")}
      <a class="gsrc" href="${esc(mapsUrl(g.url, name))}" target="_blank" rel="noopener">Tüm yorumlar Google Haritalar'da →</a></div>`;

function openPlace(id) {
  const m = DATA.mekanlar.find(x => x.id === id), q = norm($("#q").value.trim()), open = isOpen(m.hours);
  const dlg = $("#dlg");
  dlg.innerHTML = `
    <div class="dhead">
      <h2 id="dlg-title">${esc(m.name)}</h2>
      <button class="icon-btn close" aria-label="Kapat">✕</button>
      <div class="meta" style="margin-top:6px">${m.hours ? `<span class="status ${open ? "open" : "closed"}">${open ? "Açık" : "Kapalı"}</span>` : ""}<span>${esc(m.hours || "Saat bilinmiyor")}</span><span>· ${esc(m.type)}</span></div>
      ${m.note ? `<p class="note">${esc(m.note)}</p>` : ""}
      <div class="actions">${m.phone ? `<a class="call" href="tel:${esc(m.phone)}">📞 Ara · ${esc(m.phoneText || m.phone)}</a>` : ""}<a href="${esc(m.google ? mapsUrl(m.google.url, m.name) : m.map || `https://www.google.com/maps/search/${encodeURIComponent(m.name + " Balçova İzmir")}`)}" target="_blank" rel="noopener">📍 Harita</a></div>
    </div>
    <div class="dbody">${m.google ? `<details open class="gdet">${googleHtml(m.google, m.name)}</details>` : ""}${m.cats.map((c, i) => {
      const matched = q && c.items.some(it => norm(it[0]).includes(q));
      return `<details ${(i === 0 && !m.google) || matched ? "open" : ""}><summary>${esc(c.name)}</summary>
        <table><thead><tr><th>Ürün</th>${(c.cols || ["Fiyat"]).map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>
        <tbody>${c.items.map(it => { const {n, p, img} = splitItem(it); return `<tr class="${q && norm(n).includes(q) ? "match" : ""}"><td>${img ? `<img class="thumb" src="${esc(img)}" alt="${esc(n)}" loading="lazy">` : ""}${esc(n)}</td>${p.map(x => `<td>${esc(tl(x))}</td>`).join("")}</tr>`; }).join("")}</tbody></table>
      </details>`;
    }).join("")}</div>`;
  dlg.querySelector(".close").onclick = () => dlg.close();
  dlg.querySelector(".dbody").onclick = e => {
    if (!e.target.matches(".thumb")) return;
    dlg.querySelector(".zoom")?.remove();
    const big = Object.assign(document.createElement("img"), {className: "zoom", src: e.target.src, alt: e.target.alt});
    big.onclick = () => big.remove();
    e.target.closest("details").before(big);
    big.scrollIntoView({behavior: "smooth", block: "nearest"});
  };
  dlg.showModal();
  // saved reviews show instantly; swap in live ones from Google when they arrive
  if (m.google) fetch(`/api/yorumlar?id=${encodeURIComponent(m.id)}`).then(r => r.ok ? r.json() : null).then(g => {
    if (!g?.reviews.length) return;
    m.google = g;
    const d = dlg.open && dlg.querySelector("#dlg-title").textContent === m.name && dlg.querySelector(".gdet");
    if (d) d.innerHTML = googleHtml(g, m.name);
  }).catch(() => {});
}
$("#dlg").onclick = e => { if (e.target === e.currentTarget) e.currentTarget.close(); }; // backdrop click

/* ---------- chrome ---------- */
function tick() {
  $("#clock").textContent = new Date().toLocaleTimeString("tr-TR", {hour: "2-digit", minute: "2-digit"});
}
$("#theme").onclick = () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
  try { localStorage.theme = r.dataset.theme; } catch {}
};
try { if (localStorage.theme) document.documentElement.dataset.theme = localStorage.theme; } catch {}

// self-check for the midnight-crossing logic
const at = (h, m) => new Date(2026, 0, 1, h, m);
console.assert(isOpen("12:00-04:00", at(2, 0)) && !isOpen("12:00-04:00", at(5, 0)) && isOpen("08:00-23:00", at(9, 0)) && !isOpen("08:00-23:00", at(23, 30)), "isOpen failed");

tick();
// /api only exists on Vercel; plain static preview falls back to the seed file
fetch("/api/esnaflar").then(r => r.ok ? r.json() : Promise.reject()).catch(() => fetch("/esnaflar.json").then(r => r.json()))
  .then(list => { DATA.mekanlar = list; renderChips(); renderPlaces(); })
  .catch(() => { $("#grid").innerHTML = `<div class="empty">Esnaflar yüklenemedi, sayfayı yenileyin.</div>`; });
setInterval(() => { tick(); renderPlaces(); }, 60000);
</script>
</body>
</html>
